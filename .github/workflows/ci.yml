# CI for the longctx kit.
#
# STATUS: EXECUTED -- two runs on 2026-10-06 (on push).
# Run 1: windows-latest leg green (1 m 14 s). macos-latest leg red in 7 s on a
# null $env:TEMP in merge-claude-settings.ps1 -SelfTest (the variable does not
# exist on macOS) -- fixed in the same round (OS-aware sandbox root,
# [System.IO.Path]::GetTempPath(); RED->GREEN proven locally).
# Run 2 (after that fix): Windows legs green; macOS legs red on case 14a of the
# selftest -- the lock simulation assumes Windows semantics (FileShare locks are
# mandatory there, advisory on Unix, so a rename over an open file always
# succeeds and the case could never pass). Case 14 is now OS-branched: Windows
# keeps the handle lock; on macOS/Linux the unwritable target is a read-only
# sandbox directory (EACCES at the save's first write), same three assertions.
# RED->GREEN proven locally on Windows in both interpreters, plus the null-env
# proxy; the Unix branch first executes on the re-run that is pending. It is
# committed as an executable specification of the test matrix: what is checked,
# on which OS, with which shell.
# No secrets, no deploy steps.
#
# What it runs, per leg:
#   - core/lib/merge-claude-settings.ps1 -SelfTest   (pwsh; on Windows also
#     via powershell.exe, i.e. Windows PowerShell 5.1)
#   - core/tests/smoke.ps1                           (pwsh; on Windows also
#     via powershell.exe)
#   - bash -n over every *.sh file, macOS leg only (skipped when the tree
#     has no shell scripts, so the macOS leg stays green on the
#     PowerShell-only repository)
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PowerShell version
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()

      - name: Merge engine self-test (pwsh)
        shell: pwsh
        run: pwsh -NoProfile -File core/lib/merge-claude-settings.ps1 -SelfTest

      - name: Merge engine self-test (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File core/lib/merge-claude-settings.ps1 -SelfTest

      - name: Smoke harness (pwsh)
        shell: pwsh
        run: pwsh -NoProfile -File core/tests/smoke.ps1

      - name: Smoke harness (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File core/tests/smoke.ps1

      - name: Shell script lint (macOS leg)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' f; do
            found=1
            echo "bash -n $f"
            bash -n "$f"
          done < <(find . -name .git -prune -o -type f -name '*.sh' -print0)
          if [ "$found" -eq 0 ]; then
            echo "No .sh files present; nothing to lint."
          fi
